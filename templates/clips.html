<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clips • HENDERBURGH</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <meta property="og:title" content="HENDERBURGH • Clips">
  <meta property="og:description" content="Game clips and highlights.">
  <meta property="og:type" content="website">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');

    :root {
      --bg: #0f1115; --card: #161a20; --accent-green: #4ade80;
      --text-primary: #e2e8f0; --text-secondary: #94a3b8;
    }
    body {
      font-family: 'Inter', system_ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1115;
      color: #e2e8f0;
    }
    .font-display {
      font-family: 'Space Grotesk', 'Inter', system_ui, sans-serif;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #737373;
      font-weight: 600;
    }

    .nav-link {
      color: #a1a1aa;
      transition: color 0.15s ease;
      font-weight: 500;
      font-size: 14px;
    }
    .nav-link:hover {
      color: #f4f4f5;
    }
    .nav-link.active {
      color: #fff;
      font-weight: 600;
    }

    .clip-card {
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .clip-card:hover {
      border-color: #52525b;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.2), 0 4px 6px -4px rgb(0 0 0 / 0.2);
    }
    .clip-card { border-radius: 1.5rem; padding: 0; overflow: hidden; } /* rounded-3xl */

    .clip-card video {
      width: 100%;
      display: block;
      background: #000;
    }

    .clip-meta {
      padding: 16px;
    }

    .clip-meta .title {
      font-weight: 600;
      font-size: 15px;
      line-height: 1.3;
      margin-bottom: 4px;
      color: #f4f4f5;
    }

    .clip-meta .date {
      font-size: 12px;
      color: #a1a1aa;
    }

    .tag {
      font-size: 10px;
      padding: 1px 8px;
      border-radius: 9999px;
      background: #27272a;
      color: #a1a1aa;
      font-weight: 500;
    }

    .filter-btn {
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid #3f3f46;
      background: #18181b;
      color: #d4d4d8;
      transition: all 0.15s;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: #27272a;
      color: #fff;
      border-color: #52525b;
    }
    /* Neon + Aurora (full system) */
    .neon-drift{display:inline-flex;gap:6px}.neon-drift .dot{width:6px;height:6px;background:#4ade80;border-radius:9999px;box-shadow:0 0 8px #4ade80;animation:neon-drift 1.2s infinite ease-in-out}
    .neon-drift .dot:nth-child(2){animation-delay:.2s}.neon-drift .dot:nth-child(3){animation-delay:.4s}
    @keyframes neon-drift{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1.1);opacity:1}}
    .aurora-bg{position:absolute;inset:-20%;background:radial-gradient(circle at 30% 20%,rgba(74,222,128,.08) 0%,transparent 50%),radial-gradient(circle at 70% 80%,rgba(96,165,250,.06) 0%,transparent 60%);pointer-events:none;z-index:0;opacity:.55;animation:aurora-drift 18s ease-in-out infinite}
    @keyframes aurora-drift{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(2%,-3%) rotate(1deg)}}
  </style>
</head>
<body class="bg-[#0a0a0b] text-zinc-200 antialiased">
  <!-- Header -->
  <header class="border-b border-zinc-800 bg-[#0a0a0b]/95 backdrop-blur sticky top-0 z-50">
    <div class="max-w-[1080px] mx-auto px-6">
      <div class="h-16 flex items-center justify-between">
        <a href="/" class="flex items-center gap-x-2.5 group">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center">
            <span class="text-white text-[15px] font-semibold tracking-[-0.5px]">H</span>
          </div>
          <span class="font-semibold text-[21px] tracking-[-0.4px] font-display group-hover:opacity-90 transition">HENDERBURGH</span>
        </a>

        <nav class="hidden md:flex items-center gap-x-8 text-sm">
          <a href="/" class="hover:text-white text-zinc-400 transition">Home</a>
          <a href="/vitals" class="hover:text-white text-zinc-400 transition">Vitals</a>
          <a href="/home-assistant" class="hover:text-white text-zinc-400 transition">Lighting</a>
          <a href="/model" class="hover:text-white text-zinc-400 transition">Model</a>
          <a href="/golf" class="hover:text-white text-zinc-400 transition">Golf</a>
          <a href="/clips" class="hover:text-white text-white font-semibold transition">Clips</a>
          <a href="/xbox" class="hover:text-white text-zinc-400 transition">Xbox</a>
          <a href="/blog" class="hover:text-white text-zinc-400 transition">Blog</a>
        </nav>

        <div class="md:hidden">
          <a href="/" class="text-sm px-4 py-1.5 rounded-full border border-zinc-700 text-zinc-300 hover:bg-zinc-800">← Home</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Mobile bottom navigation (premium app-like, consistent site-wide) -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-[#111113] border-t border-zinc-800 pb-safe" style="padding-bottom: env(safe-area-inset-bottom, 0);">
    <div class="flex items-center justify-around text-[10px] text-zinc-400 py-2">
      <a href="/" class="flex flex-col items-center gap-y-0.5"><i class="fa-solid fa-home text-base"></i><span>Home</span></a>
      <a href="/vitals" class="flex flex-col items-center gap-y-0.5"><i class="fa-solid fa-heart-pulse text-base"></i><span>Vitals</span></a>
      <a href="/home-assistant" class="flex flex-col items-center gap-y-0.5"><i class="fa-solid fa-lightbulb text-base"></i><span>Lighting</span></a>
      <a href="/model" class="flex flex-col items-center gap-y-0.5"><i class="fa-solid fa-cube text-base"></i><span>Model</span></a>
      <a href="/golf" class="flex flex-col items-center gap-y-0.5"><i class="fa-solid fa-golf-ball text-base"></i><span>Golf</span></a>
      <a href="/clips" class="flex flex-col items-center gap-y-0.5 text-white"><i class="fa-solid fa-video text-base"></i><span>Clips</span></a>
      <a href="/xbox" class="flex flex-col items-center gap-y-0.5"><i class="fa-solid fa-gamepad text-base"></i><span>Xbox</span></a>
      <a href="/blog" class="flex flex-col items-center gap-y-0.5"><i class="fa-solid fa-book text-base"></i><span>Blog</span></a>
    </div>
  </nav>
      </div>
    </div>
  </header>

  <main class="max-w-[1080px] mx-auto px-6 pt-10 pb-16">
    <!-- Header -->
    <div class="mb-10">
      <div class="flex items-center gap-x-3 mb-2">
        <div class="w-9 h-9 rounded-2xl bg-orange-900/30 flex items-center justify-center">
          <i class="fa-solid fa-video text-orange-400 text-xl"></i>
        </div>
        <h1 class="text-4xl font-semibold tracking-tighter">Game Clips</h1>
      </div>
      <p class="text-lg text-zinc-400 max-w-md">Highlights from my recent sessions.</p>
    </div>

    <!-- Filters -->
    <div class="mb-8 flex flex-wrap gap-2" id="filter-buttons">
      <button onclick="filterClips('all')" class="filter-btn active" data-filter="all">All</button>
      <button onclick="filterClips('Clutch')" class="filter-btn" data-filter="Clutch">Clutch</button>
      <button onclick="filterClips('Ace')" class="filter-btn" data-filter="Ace">Ace</button>
      <button onclick="filterClips('Team Play')" class="filter-btn" data-filter="Team Play">Team Play</button>
      <button onclick="filterClips('Execute')" class="filter-btn" data-filter="Execute">Execute</button>
      <button onclick="filterClips('Post-plant')" class="filter-btn" data-filter="Post-plant">Post-plant</button>
    </div>

    <!-- Clips Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="clips-grid">
      <!-- Populated by JavaScript -->
    </div>

    <div class="mt-12 text-center">
      <a href="/" class="inline-flex items-center text-sm text-zinc-400 hover:text-white transition">
        ← Back to home
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="max-w-[1080px] mx-auto px-6 pb-10">
    <div class="border-t border-zinc-800 pt-6 text-xs text-zinc-500 text-center">
      Personal game highlights • HENDERBURGH
    </div>
  </footer>

  <script>
    const clips = [
      {
        id: 1,
        title: "Clutch 1v3",
        date: "Feb 12, 2026",
        src: "clips/clutch-moment.mp4",
        tags: ["Clutch"],
        description: "3v1 retake on defense"
      },
      {
        id: 2,
        title: "Insane team play",
        date: "Jan 28, 2026",
        src: "clips/team-win.mp4",
        tags: ["Team Play"],
        description: "Perfect coordination on Haven"
      },
      {
        id: 3,
        title: "Ace on Haven",
        date: "Jan 15, 2026",
        src: "clips/ace.mp4",
        tags: ["Ace", "Clutch"],
        description: "5 kills in a single round"
      },
      {
        id: 4,
        title: "1v4 Retake",
        date: "Dec 3, 2025",
        src: "clips/clutch-moment.mp4",
        tags: ["Clutch"],
        description: "Impossible retake on B site"
      },
      {
        id: 5,
        title: "Perfect Execute",
        date: "Nov 22, 2025",
        src: "clips/team-win.mp4",
        tags: ["Execute", "Team Play"],
        description: "Textbook A site execute"
      },
      {
        id: 6,
        title: "Post-plant 3k",
        date: "Nov 8, 2025",
        src: "clips/ace.mp4",
        tags: ["Post-plant", "Clutch"],
        description: "Clutch post-plant on Bind"
      },
      {
        id: 7,
        title: "4k on Bind",
        date: "Oct 19, 2025",
        src: "clips/clutch-moment.mp4",
        tags: ["Clutch"],
        description: "Back-to-back clutches"
      },
      {
        id: 8,
        title: "Last Second Defuse",
        date: "Oct 5, 2025",
        src: "clips/team-win.mp4",
        tags: ["Clutch", "Execute"],
        description: "1.3 seconds left"
      }
    ];

    function renderClips(filteredClips) {
      const grid = document.getElementById('clips-grid');
      grid.innerHTML = '';

      const toRender = filteredClips || clips;

      toRender.forEach(clip => {
        const card = document.createElement('div');
        card.className = 'clip-card';
        card.dataset.tags = clip.tags.join(',');

        const tagsHTML = clip.tags.map(tag => 
          `<span class="tag">${tag}</span>`
        ).join('');

        card.innerHTML = `
          <video controls preload="metadata" class="w-full">
            <source src="${clip.src}" type="video/mp4">
            Your browser does not support the video tag.
          </video>
          <div class="clip-meta">
            <div class="title">${clip.title}</div>
            <div class="date">${clip.date}</div>
            ${clip.description ? `<div class="text-sm text-zinc-400 mt-1">${clip.description}</div>` : ''}
            <div class="flex flex-wrap gap-1 mt-3">
              ${tagsHTML}
            </div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    let currentFilter = 'all';

    function filterClips(filter) {
      currentFilter = filter;

      // Update button states
      document.querySelectorAll('#filter-buttons button').forEach(btn => {
        btn.classList.remove('active');
        if (filter === 'all' && btn.dataset.filter === 'all') {
          btn.classList.add('active');
        } else if (btn.dataset.filter === filter) {
          btn.classList.add('active');
        }
      });

      const grid = document.getElementById('clips-grid');
      const cards = grid.querySelectorAll('.clip-card');

      cards.forEach(card => {
        const tags = card.dataset.tags.split(',');
        
        if (filter === 'all') {
          card.style.display = '';
        } else {
          if (tags.includes(filter)) {
            card.style.display = '';
          } else {
            card.style.display = 'none';
          }
        }
      });
    }

    // Initialize
    function initClipsPage() {
      renderClips();

      // Make sure "All" button starts active
      const allBtn = document.querySelector('#filter-buttons button[data-filter="all"]');
      if (allBtn) allBtn.classList.add('active');

      // Optional: keyboard support
      document.addEventListener('keydown', function(e) {
        if (e.key === '/' && document.activeElement.tagName === 'BODY') {
          e.preventDefault();
          const search = prompt('Filter by tag (Clutch, Ace, etc):');
          if (search) {
            filterClips(search.trim());
          }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', initClipsPage);

    // Premium Anime micro for cards (calm lift/scale)
    if (typeof anime !== 'undefined') {
      document.addEventListener('pointerdown', e => { const c = e.target.closest('.clip-card'); if(c){anime.remove(c);anime({targets:c,scale:.985,translateY:'1px',duration:70,easing:'easeOutQuad'});} }, {passive:true});
      const rel = c => {if(c){anime.remove(c);anime({targets:c,scale:1,translateY:0,duration:380,easing:'easeOutElastic(1,.6)'});}};
      document.addEventListener('pointerup', e=>rel(e.target.closest('.clip-card')),{passive:true});
      document.addEventListener('mouseenter', e=>{const c=e.target.closest('.clip-card');if(c){anime.remove(c);anime({targets:c,translateY:-2,scale:1.003,duration:160,easing:'easeOutQuad'});}},true);
      document.addEventListener('mouseleave', e=>{const c=e.target.closest('.clip-card');if(c){anime.remove(c);anime({targets:c,translateY:0,scale:1,duration:200,easing:'easeOutQuad'});}},true);
    }
  </script>
</body>
</html>
