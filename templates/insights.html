<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>House Insights • HENDERBURGH</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <meta name="robots" content="noindex">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/tokens.css?v=4">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap');
    /* Page-local aliases now resolve to the shared tokens (static/tokens.css)
       instead of one-off hexes, so this page can't drift from the rest of the
       OS again. */
    body { font-family: var(--font-sans); background: var(--bg); color: var(--text); }
    .font-display { font-family: var(--font-display); }
    .section-label { font-family: var(--font-mono); font-size: var(--t-label); letter-spacing:0.16em; text-transform:uppercase; color: var(--text-3); font-weight:600; }
    .card { background: var(--surface); border:1px solid var(--line); border-radius: var(--r-lg); }
    .pill { font-size: var(--t-xs); padding:2px 9px; border-radius: var(--r-full); font-weight:600; }
    .heat { width:11px; height:16px; border-radius: var(--r-sm); background: var(--surface-2); display:inline-block; }
    a.nav { color: var(--text-2); } a.nav:hover { color: var(--text); }
    .swatch { width:14px; height:14px; border-radius: var(--r-sm); display:inline-block; vertical-align:-2px; border:1px solid var(--line-strong); }
    .hb-tap-inline { min-height: var(--tap-min); display: inline-flex; align-items: center; }
  </style>
  <script defer src="/static/motion.js?v=4"></script>
</head>
<body class="hb-chrome-offset min-h-screen">
  <!-- Unified chrome. Same bar language as the homepage ticker: fixed slim
       translucent rail, 1px hairline, Space Grotesk wordmark, mono nav.
       Styles live in static/tokens.css (.hb-chrome*) so all pages stay identical. -->
  <header class="hb-chrome">
    <a href="/" class="hb-chrome-brand">HENDERBURGH</a>
    <nav class="hb-chrome-nav hidden md:flex">
      <a href="/">Home</a>
      <a href="/vitals">Vitals</a>
      <a href="/home-assistant" class="active">Lighting</a>
      <a href="/model">Model</a>
      <a href="/golf">Golf</a>
      <a href="/clips">Clips</a>
      <a href="/xbox">Xbox</a>
      <a href="/blog">Blog</a>
    </nav>
    <span class="hb-chrome-spacer"></span>
    <div class="md:hidden flex items-center -my-2.5 -mr-2">
      <a href="/" aria-label="Home" class="w-11 h-11 flex items-center justify-center rounded-xl text-[var(--text-3)] hover:text-[var(--text)] active:bg-[var(--surface-2)] transition"><i class="fa-solid fa-home text-base"></i></a>
      <a href="/vitals" aria-label="Vitals" class="w-11 h-11 flex items-center justify-center rounded-xl text-[var(--text-3)] hover:text-[var(--text)] active:bg-[var(--surface-2)] transition"><i class="fa-solid fa-heart-pulse text-base"></i></a>
      <a href="/home-assistant" aria-label="Lighting" class="w-11 h-11 flex items-center justify-center rounded-xl text-[var(--text-3)] hover:text-[var(--text)] active:bg-[var(--surface-2)] transition"><i class="fa-solid fa-lightbulb text-base"></i></a>
      <a href="/xbox" aria-label="Xbox" class="w-11 h-11 flex items-center justify-center rounded-xl text-[var(--text-3)] hover:text-[var(--text)] active:bg-[var(--surface-2)] transition"><i class="fa-solid fa-gamepad text-base"></i></a>
    </div>
  </header>
  <div class="max-w-5xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between mb-6">
      <div>
        <div class="section-label">Private · {{ display_name }}</div>
        <h1 class="font-display text-2xl font-bold mt-1">House Insights</h1>
      </div>
      <a href="/home-assistant" class="hb-tap-inline nav text-sm"><i class="fa-solid fa-arrow-left mr-1"></i>Lighting</a>
    </div>

    <div id="lock" class="hb-spot card p-8 text-center hidden">
      <i class="fa-solid fa-lock text-2xl text-[var(--text-2)] mb-3"></i>
      <p class="text-[var(--text)] mb-4">Unlock to see your house's patterns.</p>
      <input id="pin" type="password" inputmode="numeric" placeholder="Admin token"
        class="hb-tap bg-[var(--bg)] border border-[var(--line)] rounded-lg px-4 py-2 text-center outline-none focus:border-[var(--accent)]">
      <button onclick="unlock()" class="hb-tap ml-2 bg-[var(--accent-dim)] border border-[var(--accent-line)] text-[var(--accent)] hover:opacity-90 rounded-lg px-4 py-2 font-semibold">Unlock</button>
      <p id="lockerr" class="text-[var(--danger)] text-sm mt-3 hidden"></p>
    </div>

    <div id="loading" class="text-center text-[var(--text-2)] py-16">
      <i class="fa-solid fa-circle-notch fa-spin text-xl"></i>
      <p class="mt-2 text-sm">Reading your house…</p>
    </div>

    <div id="report" class="hidden space-y-6"></div>
  </div>

<script>
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(id){ document.getElementById(id).classList.remove('hidden'); }
function hide(id){ document.getElementById(id).classList.add('hidden'); }

async function unlock(){
  const t = document.getElementById('pin').value.trim();
  const err = document.getElementById('lockerr');
  try {
    const r = await fetch('/api/auth/unlock', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({token:t})});
    if(!r.ok){ const d=await r.json().catch(()=>({})); err.textContent=d.detail||'Wrong token'; show('lockerr'); return; }
    hide('lock'); show('loading'); load();
  } catch(e){ err.textContent='Network error'; show('lockerr'); }
}

function heatRow(byhour){
  let cells='';
  for(let h=0; h<24; h++){
    const v = byhour[h] ?? byhour[String(h)];
    const on = (v==null) ? null : v;
    const bg = on==null ? 'var(--surface-2)' : `rgba(96,165,250,${0.12 + 0.88*(on/100)})`;
    const tip = on==null ? `${h}:00 no data` : `${h}:00 · ${on}% on`;
    cells += `<span class="heat" style="background:${bg}" title="${tip}"></span>`;
  }
  return `<div class="flex gap-[2px] items-end">${cells}</div>`;
}

function lookChip(label){
  const isHex = /^#[0-9a-f]{6}$/i.test(label||'');
  const sw = isHex ? `<span class="swatch" style="background:${label}"></span> ` : '';
  return `<span class="pill bg-[var(--surface-2)] text-[var(--text)]">${sw}${esc(label)}</span>`;
}

function strengthPill(s){
  const map = {strong:['var(--success-dim)','var(--success)'], emerging:['rgba(245,158,11,0.14)','var(--warn)'], weak:['var(--surface-2)','var(--text-2)']};
  const [bg,fg] = map[s]||map.weak;
  return `<span class="pill" style="background:${bg};color:${fg}">${s}</span>`;
}

function render(d){
  const c = d.coverage;
  const parts = [];

  // Coverage / countdown to a week
  parts.push(`<div class="hb-spot card p-5">
    <div class="section-label mb-2">Data Collection</div>
    <div class="flex items-end justify-between mb-2">
      <div class="font-display text-3xl font-bold">${c.days_collected}<span class="text-[var(--text-2)] text-lg font-normal"> / ${c.target_days} days</span></div>
      <div class="text-right text-xs text-[var(--text-2)]">
        ${c.snapshots} snapshots · ${c.changes_logged} light changes<br>${c.commands_logged} voice commands
      </div>
    </div>
    <div class="h-2 rounded-full bg-[var(--bg)] overflow-hidden">
      <div class="h-full rounded-full" style="width:${c.progress_pct}%;background:${c.ready?'var(--success)':'var(--info)'}"></div>
    </div>
    <p class="text-xs mt-2" style="color:${c.ready?'var(--success)':'var(--text-2)'}">
      ${c.ready ? '✓ A full week collected — ready to design automations from real patterns.'
                : `Collecting… ${c.target_days - c.days_collected} more day(s) for a confident week of data. Watching ${c.hours_covered.length} hours/day.`}
    </p>
  </div>`);

  // Candidate automations — the headline
  const cand = d.candidate_automations||[];
  parts.push(`<div class="hb-spot card p-5">
    <div class="section-label mb-3">Candidate Automations · learned from what you actually do</div>
    ${cand.length ? cand.map(a=>`
      <div class="flex items-center gap-3 py-2 border-b border-[var(--line)] last:border-0">
        ${strengthPill(a.strength)}
        <div class="flex-1 text-sm">${esc(a.suggestion)}</div>
        <div class="text-xs text-[var(--text-2)] whitespace-nowrap">${a.days}d · ${a.count}×</div>
      </div>`).join('')
      : `<p class="text-sm text-[var(--text-2)]">No repeating patterns yet — they'll surface as you use the lights over the next few days.</p>`}
    <p class="text-[var(--t-xs)] text-[var(--text-2)] mt-3">Ranked by how many different days a pattern repeats. "Strong" = seen on 3+ days.</p>
  </div>`);

  // What you set lights TO
  const sp = d.set_preferences||[];
  if(sp.length) parts.push(`<div class="hb-spot card p-5">
    <div class="section-label mb-3">What You Set Each Light To</div>
    ${sp.slice(0,10).map(l=>`
      <div class="flex items-center gap-3 py-2 border-b border-[var(--line)] last:border-0">
        <div class="w-40 truncate text-sm">${esc(l.name)}</div>
        <div class="flex-1 flex flex-wrap gap-1">${l.top_targets.map(t=>`${lookChip(t.look)}<span class="text-[var(--t-xs)] text-[var(--text-2)] mr-2">${t.pct}%</span>`).join('')}</div>
        <div class="text-xs text-[var(--text-2)]">${l.changes}×</div>
      </div>`).join('')}
  </div>`);

  // Per-light profiles with hour heatmap
  const L = d.lights||[];
  parts.push(`<div class="hb-spot card p-5">
    <div class="section-label mb-3">Light Profiles · on-rate by hour (0–23)</div>
    ${L.map(l=>`
      <div class="py-2.5 border-b border-[var(--line)] last:border-0">
        <div class="flex items-center justify-between mb-1.5">
          <div class="text-sm font-medium">${esc(l.name)} ${l.room?`<span class="text-[var(--text-2)] text-xs">· ${esc(l.room)}</span>`:''}</div>
          <div class="flex items-center gap-2 text-xs text-[var(--text-2)]">
            ${l.favorite_look?lookChip(l.favorite_look):''}
            <span>${l.on_rate}% on</span>
            ${l.typical_brightness!=null?`<span>· ${l.typical_brightness}% bri</span>`:''}
          </div>
        </div>
        ${heatRow(l.byhour||{})}
      </div>`).join('')}
  </div>`);

  // Unmet requests / scenes you asked for that don't exist
  const un = d.unmet_requests||[];
  if(un.length) parts.push(`<div class="hb-spot card p-5">
    <div class="section-label mb-3">Scenes You Asked For That Don't Exist Yet</div>
    ${un.map(u=>`<div class="text-sm py-1 text-[var(--warn)]">"${esc(u.text)}" <span class="text-[var(--text-2)] text-xs">· ${esc((u.ts||'').slice(0,10))}</span></div>`).join('')}
    <p class="text-[var(--t-xs)] text-[var(--text-2)] mt-2">Commands the parser didn't understand — each is a scene worth building.</p>
  </div>`);

  document.getElementById('report').innerHTML = parts.join('');
  hide('loading'); show('report');
}

async function load(){
  try {
    const r = await fetch('/api/ha/insights');
    if(r.status===401 || r.status===403){ hide('loading'); show('lock'); return; }
    if(!r.ok){ document.getElementById('loading').innerHTML = '<p class="text-[var(--danger)]">Could not load insights.</p>'; return; }
    render(await r.json());
  } catch(e){
    document.getElementById('loading').innerHTML = '<p class="text-[var(--danger)]">Network error.</p>';
  }
}
load();
</script>
</body>
</html>
