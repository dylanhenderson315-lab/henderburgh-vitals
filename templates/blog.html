<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog &amp; Messages • HENDERBURGH</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <meta property="og:title" content="HENDERBURGH • Blog">
  <meta property="og:description" content="Thoughts, updates, and a place to leave a note.">
  <meta property="og:type" content="website">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/tokens.css?v=3">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');

    /* Page-local aliases now resolve to the shared tokens (static/tokens.css)
       instead of one-off hexes, so this page can't drift from the rest of the
       OS again. Old stack said `system_ui` (underscore), an invalid keyword
       that silently dropped the system-font fallback. */
    :root {
      --card: var(--surface); --accent-green: var(--accent);
      --text-primary: var(--text); --text-secondary: var(--text-2);
    }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
    }
    .font-display {
      font-family: var(--font-display);
    }

    .section-label {
      font-family: var(--font-mono);
      font-size: var(--t-label);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--text-3);
      font-weight: 600;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-sm);
      transition: border-color var(--d-fast) ease, box-shadow var(--d-fast) ease;
    }
    .card:hover {
      border-color: var(--line-strong);
      box-shadow: var(--shadow-md);
    }
    .card, .message-card { border-radius: var(--r-lg); }

    .message-card {
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: 16px;
      background: var(--surface-2);
      color: var(--text);
    }

    .nav-link {
      color: var(--text-2);
      transition: color var(--d-fast) ease;
      font-weight: 500;
      font-size: 14px;
    }
    .nav-link:hover {
      color: var(--text);
    }

    .form-input {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      padding: 10px 14px;
      font-size: 14px;
      color: var(--text);
      transition: border-color var(--d-fast) ease;
    }
    .form-input:focus {
      border-color: var(--line-strong);
      outline: none;
      background: var(--surface);
    }

    .btn {
      background: var(--surface-2);
      color: var(--text);
      font-weight: 500;
      padding: 10px 18px;
      border-radius: var(--r-sm);
      font-size: 14px;
      border: 1px solid var(--line);
      min-height: var(--tap-min);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background var(--d-fast) ease, border-color var(--d-fast) ease;
    }
    .btn:hover {
      background: var(--surface-3);
      border-color: var(--line-strong);
    }
    /* NeonDrift + Aurora — decorative brand motion, so these use --accent
       (cyan), not --success; they're not signalling a state. */
    .neon-drift{display:inline-flex;gap:6px}.neon-drift .dot{width:6px;height:6px;background:var(--accent);border-radius:var(--r-full);box-shadow:0 0 8px var(--accent);animation:neon-drift 1.2s infinite ease-in-out}
    .neon-drift .dot:nth-child(2){animation-delay:.2s}.neon-drift .dot:nth-child(3){animation-delay:.4s}
    @keyframes neon-drift{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1.1);opacity:1}}
    .aurora-bg{position:absolute;inset:-20%;background:radial-gradient(circle at 30% 20%,rgba(var(--accent-rgb),.08) 0%,transparent 50%),radial-gradient(circle at 70% 80%,rgba(96,165,250,.06) 0%,transparent 60%);pointer-events:none;z-index:0;opacity:.55;animation:aurora-drift 18s ease-in-out infinite}
    @keyframes aurora-drift{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(2%,-3%) rotate(1deg)}}
  </style>
  <script defer src="/static/os-command.js"></script>
  <script defer src="/static/motion.js?v=4"></script>
</head>
<body class="bg-[var(--bg)] text-[var(--text)] antialiased">
  <!-- Header -->
  <header class="border-b border-zinc-800 bg-[var(--bg)]/95 backdrop-blur sticky top-0 z-50">
    <div class="max-w-[1080px] mx-auto px-6">
      <div class="h-16 flex items-center justify-between">
        <a href="/" class="flex items-center gap-x-2.5 group">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center">
            <span class="text-white text-[15px] font-semibold tracking-[-0.5px]">H</span>
          </div>
          <span class="font-semibold text-[21px] tracking-[-0.4px] font-display group-hover:opacity-90 transition">HENDERBURGH</span>
        </a>

        <nav class="hidden md:flex items-center gap-x-8 text-sm">
          <a href="/" class="hover:text-white text-zinc-400 transition">Home</a>
          <a href="/vitals" class="hover:text-white text-zinc-400 transition">Vitals</a>
          <a href="/golf" class="hover:text-white text-zinc-400 transition">Golf</a>
          <a href="/clips" class="hover:text-white text-zinc-400 transition">Clips</a>
          <a href="/xbox" class="hover:text-white text-zinc-400 transition">Xbox</a>
          <a href="/home-assistant" class="hover:text-white text-zinc-400 transition">Lighting</a>
          <a href="/model" class="hover:text-white text-zinc-400 transition">Model</a>
          <a href="/blog" class="hover:text-white text-zinc-400 transition">Blog</a>
        </nav>

        <div class="md:hidden">
          <a href="/" class="text-sm px-4 py-1.5 rounded-full border border-zinc-700 text-zinc-300 hover:bg-zinc-800">← Home</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Mobile bottom navigation (premium app-like, consistent site-wide) -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-[var(--surface)] border-t border-zinc-800 pb-safe" style="padding-bottom: env(safe-area-inset-bottom, 0);">
    <div class="flex items-center justify-around text-[10px] text-zinc-400 py-2">
      <a href="/" class="hb-tap justify-center flex flex-col items-center gap-y-0.5"><i class="fa-solid fa-home text-base"></i><span>Home</span></a>
      <a href="/vitals" class="hb-tap justify-center flex flex-col items-center gap-y-0.5"><i class="fa-solid fa-heart-pulse text-base"></i><span>Vitals</span></a>
      <a href="/home-assistant" class="hb-tap justify-center flex flex-col items-center gap-y-0.5"><i class="fa-solid fa-lightbulb text-base"></i><span>Lighting</span></a>
      <a href="/model" class="hb-tap justify-center flex flex-col items-center gap-y-0.5"><i class="fa-solid fa-cube text-base"></i><span>Model</span></a>
      <a href="/golf" class="hb-tap justify-center flex flex-col items-center gap-y-0.5"><i class="fa-solid fa-golf-ball text-base"></i><span>Golf</span></a>
      <a href="/clips" class="hb-tap justify-center flex flex-col items-center gap-y-0.5"><i class="fa-solid fa-video text-base"></i><span>Clips</span></a>
      <a href="/xbox" class="hb-tap justify-center flex flex-col items-center gap-y-0.5"><i class="fa-solid fa-gamepad text-base"></i><span>Xbox</span></a>
      <a href="/blog" class="hb-tap justify-center flex flex-col items-center gap-y-0.5 text-white"><i class="fa-solid fa-book text-base"></i><span>Blog</span></a>
    </div>
  </nav>

  <main class="max-w-[1080px] mx-auto px-6 pt-10 pb-16">
    <div class="mb-10">
      <h1 class="text-4xl font-semibold tracking-tighter">Blog &amp; Messages</h1>
      <p class="text-lg text-zinc-400 mt-2">Thoughts, updates, and a place to leave a note.</p>
    </div>

    <!-- Threaded Message Board -->
    <div class="card p-6 mb-10">
      <h2 class="text-xl font-semibold mb-2">Message Board</h2>
      <p class="text-zinc-400 mb-6">Leave a message or reply to others. Keep it friendly.</p>

      <!-- New Message Form -->
      <form id="message-form" style="margin-bottom: 24px;">
        <input type="text" id="name" placeholder="Your name (optional)" class="form-input" style="margin-bottom: 8px; width: 100%;">
        <textarea id="text" placeholder="Write your message..." required class="form-input" style="width: 100%; height: 90px; resize: vertical;"></textarea>
        <button type="submit" class="btn" style="margin-top: 10px;">
          Post Message
        </button>
      </form>

      <!-- Messages will appear here (threaded) -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 style="margin: 0; font-size: 1.1rem;">Messages</h3>
        <button onclick="enterAdminMode()"
                class="hb-tap"
                style="font-size: 0.75rem; padding: 4px 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: var(--r-sm); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;">
          Admin
        </button>
      </div>

      <div id="messages"></div>
    </div>
  </main>

  <footer class="max-w-[1080px] mx-auto px-6 pb-10">
    <div class="border-t border-zinc-800 pt-6 text-xs text-zinc-500 text-center">
      Messages are public • HENDERBURGH
    </div>
  </footer>

  <script src="/static/auth.js?v=20260710-guest2"></script>
  <script>
    async function loadMessages() {
      const res = await fetch('/api/messages');
      const messages = await res.json();
      renderMessages(messages);
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function renderMessages(messages) {
      const container = document.getElementById('messages');
      container.innerHTML = '';

      // Top level messages
      const topLevel = messages.filter(m => !m.parent_id);

      topLevel.forEach(msg => {
        const div = createMessageElement(msg, messages);
        container.appendChild(div);
      });
    }

    function createMessageElement(msg, allMessages) {
      const div = document.createElement('div');
      div.className = 'message-card';
      div.style.marginBottom = '12px';

      const time = new Date(msg.timestamp).toLocaleString();

      let html = `
        <strong>${esc(msg.name)}</strong>
        <span style="color:var(--text-3); font-size:0.8rem; margin-left: 8px;">${time}</span>
      `;

      // Admin delete button — destructive action, uses --danger.
      if (isAdminUnlocked) {
        html += `
          <button onclick="deleteMessage('${msg.id}')"
                  class="hb-tap"
                  style="float:right; color:var(--danger); font-size:18px; line-height:1; background:none; border:none; cursor:pointer; padding:0 4px; display:inline-flex; align-items:center; justify-content:center;"
                  title="Delete (admin only)">×</button>
        `;
      }

      html += `
        <p style="margin: 10px 0; white-space: pre-wrap; color:var(--text-2);">${esc(msg.text)}</p>
        <button onclick="showReplyForm('${msg.id}', this)"
                class="hb-tap"
                style="font-size: 0.8rem; color: var(--info); background: none; border: none; cursor: pointer; padding: 8px 4px; display:inline-flex; align-items:center;">
          Reply
        </button>
      `;

      div.innerHTML = html;

      // Show replies (indented)
      const replies = allMessages.filter(m => m.parent_id === msg.id);
      replies.forEach(reply => {
        const replyDiv = createMessageElement(reply, allMessages);
        replyDiv.style.marginLeft = '24px';
        replyDiv.style.borderLeft = '3px solid var(--line-strong)';
        div.appendChild(replyDiv);
      });

      return div;
    }

    function showReplyForm(parentId, button) {
      const form = document.createElement('form');
      form.style.marginTop = '10px';
      form.innerHTML = `
        <input type="text" placeholder="Your name (optional)" style="margin-bottom: 6px; width: 100%; padding: 8px; border: 1px solid var(--line); background:var(--surface-2); color:var(--text); border-radius: var(--r-sm);">
        <textarea placeholder="Your reply..." required style="width: 100%; height: 70px; padding: 8px; border: 1px solid var(--line); background:var(--surface-2); color:var(--text); border-radius: var(--r-sm);"></textarea>
        <button type="submit" class="btn" style="margin-top: 6px; padding: 6px 14px; font-size: 0.85rem;">Send Reply</button>
      `;

      form.onsubmit = async (e) => {
        e.preventDefault();
        const name = form.querySelector('input').value || 'Anonymous';
        const text = form.querySelector('textarea').value;

        await fetch('/api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, text, parent_id: parentId })
        });

        form.remove();
        loadMessages();
      };

      button.replaceWith(form);
    }

    // Handle new top-level message
    document.getElementById('message-form').onsubmit = async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value || 'Anonymous';
      const text = document.getElementById('text').value;

      await fetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, text, parent_id: null })
      });

      document.getElementById('message-form').reset();
      loadMessages();
    };

    // Load messages when page opens
    loadMessages();

    // ==================== ADMIN DELETE FUNCTIONALITY ====================
    let isAdminUnlocked = false;

    async function enterAdminMode() {
      const token = prompt("Enter admin token to manage messages:");
      if (!token) return;
      try {
        await unlockAdmin(token);
        isAdminUnlocked = true;
        alert("Admin mode activated. Delete buttons will now appear.");
        loadMessages();
      } catch (e) {
        alert("Invalid admin token.");
      }
    }

    async function initAdminMode() {
      isAdminUnlocked = await checkAdminUnlocked();
    }

    async function deleteMessage(messageId) {
      if (!isAdminUnlocked) {
        alert("Admin mode is not active. Tap Admin and enter your token first.");
        return;
      }
      if (!confirm("Delete this message (and any replies)?")) return;

      try {
        const res = await adminFetch(`/api/messages/${messageId}`, {
          method: 'DELETE'
        });

        if (res.ok) {
          loadMessages();
          return;
        }
        // Session may have expired after a deploy — prompt to re-unlock.
        if (res.status === 403) {
          isAdminUnlocked = false;
          alert("Admin session expired. Tap Admin and unlock again, then delete.");
          return;
        }
        if (res.status === 404) {
          alert("Message not found (maybe already deleted).");
          loadMessages();
          return;
        }
        const err = await res.json().catch(() => ({}));
        const detail = typeof err.detail === 'string' ? err.detail : (err.detail ? JSON.stringify(err.detail) : res.statusText);
        alert("Delete failed: " + (detail || ("HTTP " + res.status)));
      } catch (e) {
        alert("Failed to delete message: " + (e && e.message ? e.message : "network error"));
      }
    }

    // Initialize admin mode on page load
    initAdminMode();

    // Anime micro interactions for calm premium feel
    if (typeof anime !== 'undefined') {
      document.addEventListener('pointerdown', e=>{const c=e.target.closest('.card,.message-card');if(c){anime.remove(c);anime({targets:c,scale:.985,translateY:'1px',duration:70,easing:'easeOutQuad'});}}, {passive:true});
      const rel = c=>{if(c){anime.remove(c);anime({targets:c,scale:1,translateY:0,duration:380,easing:'easeOutElastic(1,.6)'});}};
      document.addEventListener('pointerup', e=>rel(e.target.closest('.card,.message-card')),{passive:true});
      document.addEventListener('mouseenter', e=>{const c=e.target.closest('.card,.message-card');if(c){anime.remove(c);anime({targets:c,translateY:-2,scale:1.003,duration:160,easing:'easeOutQuad'});}},true);
      document.addEventListener('mouseleave', e=>{const c=e.target.closest('.card,.message-card');if(c){anime.remove(c);anime({targets:c,translateY:0,scale:1,duration:200,easing:'easeOutQuad'});}},true);
    }
  </script>
</body>
</html>
