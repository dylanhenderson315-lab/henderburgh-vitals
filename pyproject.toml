[project]
name = "oura-dashboard"
version = "0.1.0"
description = "Beautiful personal Oura Ring dashboard (Python + FastAPI + HTMX + Tailwind)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
]

[tool.uv]
dev-dependencies = []

[project.scripts]
oura-dashboard = "main:main"
